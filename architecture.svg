<svg viewBox="0 0 1180 690" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#059669"/></marker>
    <marker id="ad" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1180" height="690" fill="#ffffff"/>

  <text x="30" y="34" font-size="20" font-weight="700" fill="#0f172a">Uncertainty-Aware Arrhythmia Detection &#8212; inference &amp; evaluation overview</text>
  <text x="30" y="55" font-size="12.5" fill="#64748b">ProtoECGNet Branch-1 (inherited) with added uncertainty, calibration and abstention &#183; schematic, simplified, not to scale</text>

  <rect x="1000" y="30" width="15" height="15" rx="3" fill="#f1f5f9" stroke="#64748b"/><text x="1021" y="42" font-size="12" fill="#475569">inherited</text>
  <rect x="1000" y="50" width="15" height="15" rx="3" fill="#ffffff" stroke="#059669"/><text x="1021" y="62" font-size="12" fill="#475569">this work</text>

  <!-- ============ MAIN NETWORK ============ -->
  <!-- ECG -->
  <rect x="30" y="96" width="104" height="92" rx="4" fill="#f8fafc" stroke="#64748b"/>
  <polyline points="42,118 58,118 63,110 68,128 73,106 78,118 92,118 98,118 103,110 108,128 113,106 118,118 124,118" fill="none" stroke="#ef4444" stroke-width="1.4"/>
  <polyline points="42,146 58,146 63,138 68,156 73,134 78,146 92,146 98,146 103,138 108,156 113,134 118,146 124,146" fill="none" stroke="#ef4444" stroke-width="1.4"/>
  <polyline points="42,174 58,174 63,166 68,184 73,162 78,174 92,174 98,174 103,166 108,184 113,162 118,174 124,174" fill="none" stroke="#ef4444" stroke-width="1.4"/>
  <text x="82" y="206" font-size="11.5" font-weight="600" text-anchor="middle" fill="#334155">12-lead ECG, 100 Hz, 10 s</text>
  <text x="82" y="222" font-size="11" text-anchor="middle" fill="#64748b" font-family="monospace">12 &#215; 1000</text>

  <!-- ResNet -->
  <line x1="134" y1="142" x2="162" y2="142" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <g fill="#eef2ff" stroke="#4f46e5">
    <rect x="168" y="122" width="16" height="40" rx="2"/><rect x="190" y="116" width="16" height="52" rx="2"/><rect x="212" y="110" width="16" height="64" rx="2"/><rect x="234" y="104" width="16" height="76" rx="2"/><rect x="256" y="98" width="16" height="88" rx="2"/>
  </g>
  <text x="220" y="206" font-size="11.5" font-weight="600" text-anchor="middle" fill="#334155">1D ResNet-18</text>
  <text x="220" y="222" font-size="11" text-anchor="middle" fill="#64748b" font-family="monospace">64&#8594;128&#8594;256&#8594;512</text>

  <!-- z -->
  <line x1="272" y1="142" x2="300" y2="142" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="306" y="100" width="22" height="84" rx="2" fill="#f1f5f9" stroke="#475569"/>
  <g stroke="#94a3b8"><line x1="306" y1="114" x2="328" y2="114"/><line x1="306" y1="128" x2="328" y2="128"/><line x1="306" y1="142" x2="328" y2="142"/><line x1="306" y1="156" x2="328" y2="156"/><line x1="306" y1="170" x2="328" y2="170"/></g>
  <text x="317" y="206" font-size="11.5" font-weight="600" text-anchor="middle" fill="#334155">features z</text>
  <text x="317" y="222" font-size="11" text-anchor="middle" fill="#64748b" font-family="monospace">512-d</text>

  <!-- prototype bank -->
  <line x1="328" y1="142" x2="360" y2="142" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <g stroke="#ffffff" stroke-width="1">
    <g fill="#ef4444"><rect x="366" y="102" width="12" height="12"/><rect x="366" y="117" width="12" height="12"/><rect x="366" y="132" width="12" height="12"/><rect x="366" y="147" width="12" height="12"/><rect x="366" y="162" width="12" height="12"/><rect x="366" y="177" width="12" height="12"/></g>
    <g fill="#f59e0b"><rect x="381" y="102" width="12" height="12"/><rect x="381" y="117" width="12" height="12"/><rect x="381" y="132" width="12" height="12"/><rect x="381" y="147" width="12" height="12"/><rect x="381" y="162" width="12" height="12"/><rect x="381" y="177" width="12" height="12"/></g>
    <g fill="#10b981"><rect x="396" y="102" width="12" height="12"/><rect x="396" y="117" width="12" height="12"/><rect x="396" y="132" width="12" height="12"/><rect x="396" y="147" width="12" height="12"/><rect x="396" y="162" width="12" height="12"/><rect x="396" y="177" width="12" height="12"/></g>
    <g fill="#06b6d4"><rect x="411" y="102" width="12" height="12"/><rect x="411" y="117" width="12" height="12"/><rect x="411" y="132" width="12" height="12"/><rect x="411" y="147" width="12" height="12"/><rect x="411" y="162" width="12" height="12"/><rect x="411" y="177" width="12" height="12"/></g>
    <g fill="#6366f1"><rect x="426" y="102" width="12" height="12"/><rect x="426" y="117" width="12" height="12"/><rect x="426" y="132" width="12" height="12"/><rect x="426" y="147" width="12" height="12"/><rect x="426" y="162" width="12" height="12"/><rect x="426" y="177" width="12" height="12"/></g>
    <g fill="#a855f7"><rect x="441" y="102" width="12" height="12"/><rect x="441" y="117" width="12" height="12"/><rect x="441" y="132" width="12" height="12"/><rect x="441" y="147" width="12" height="12"/><rect x="441" y="162" width="12" height="12"/><rect x="441" y="177" width="12" height="12"/></g>
    <g fill="#ec4899"><rect x="456" y="102" width="12" height="12"/><rect x="456" y="117" width="12" height="12"/><rect x="456" y="132" width="12" height="12"/><rect x="456" y="147" width="12" height="12"/><rect x="456" y="162" width="12" height="12"/><rect x="456" y="177" width="12" height="12"/></g>
  </g>
  <text x="417" y="208" font-size="11.5" font-weight="600" text-anchor="middle" fill="#334155">prototype bank</text>

  <!-- similarity scores node -->
  <line x1="468" y1="142" x2="496" y2="142" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="482" y="134" font-size="9.5" text-anchor="middle" fill="#334155">cos sim</text>
  <rect x="500" y="118" width="20" height="48" rx="2" fill="#f1f5f9" stroke="#475569"/>
  <text x="510" y="182" font-size="10" text-anchor="middle" fill="#64748b">scores</text>

  <!-- linear -> sigmoid -> probs -->
  <line x1="520" y1="142" x2="546" y2="142" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="550" y="122" width="56" height="40" rx="4" fill="#eef2ff" stroke="#4f46e5"/><text x="578" y="146" font-size="11.5" text-anchor="middle" fill="#3730a3">linear</text>
  <line x1="606" y1="142" x2="632" y2="142" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/><text x="619" y="135" font-size="9.5" text-anchor="middle" fill="#334155">logits</text>
  <rect x="636" y="122" width="60" height="40" rx="4" fill="#eef2ff" stroke="#4f46e5"/><text x="666" y="146" font-size="11.5" text-anchor="middle" fill="#3730a3">sigmoid</text>
  <line x1="696" y1="142" x2="722" y2="142" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <g><line x1="728" y1="188" x2="856" y2="188" stroke="#94a3b8"/>
    <rect x="732" y="150" width="14" height="38" fill="#ef4444"/><rect x="750" y="120" width="14" height="68" fill="#f59e0b"/><rect x="768" y="164" width="14" height="24" fill="#10b981"/><rect x="786" y="140" width="14" height="48" fill="#06b6d4"/><rect x="804" y="170" width="14" height="18" fill="#6366f1"/><rect x="822" y="176" width="14" height="12" fill="#a855f7"/><rect x="840" y="178" width="14" height="10" fill="#ec4899"/>
  </g>
  <text x="792" y="110" font-size="11.5" font-weight="600" text-anchor="middle" fill="#334155">P(rhythm), multi-label</text>
  <text x="792" y="206" font-size="9.5" text-anchor="middle" fill="#64748b" font-family="monospace">SR AFIB SB ST AF SVT AT</text>
  <text x="905" y="138" font-size="11" fill="#334155">prediction explained by the</text>
  <text x="905" y="154" font-size="11" fill="#334155">prototypes it matches</text>

  <text x="30" y="290" font-size="10.5" fill="#64748b">Prototypes: 6 per class (96 for PTB-XL; 42 for Chapman/Georgia). Grid shows a 7-class example.</text>

  <!-- ============ THIS WORK ============ -->
  <rect x="20" y="300" width="1140" height="320" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-dasharray="6 5"/>
  <text x="36" y="322" font-size="12.5" font-weight="700" fill="#047857">This work &#183; uncertainty &#183; calibration &#183; abstention   (schematic &#8212; not experimental results)</text>

  <!-- taps -->
  <path d="M792,192 L792,240 L165,240 L165,346" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ad)"/>
  <text x="300" y="234" font-size="10.5" fill="#64748b">30 full-model passes, dropout active; aggregate output probabilities</text>
  <path d="M510,166 L510,272 L705,272 L705,346" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ad)"/>
  <text x="600" y="288" font-size="10.5" fill="#64748b">similarity scores</text>

  <!-- Panel A: MC Dropout -->
  <rect x="40" y="350" width="250" height="150" rx="6" fill="#ffffff" stroke="#059669"/>
  <text x="56" y="374" font-size="13" font-weight="700" fill="#064e3b">MC Dropout</text>
  <g fill="#d1fae5" stroke="#10b981"><rect x="56" y="388" width="56" height="26" rx="3"/><rect x="63" y="394" width="56" height="26" rx="3" opacity="0.7"/><rect x="70" y="400" width="56" height="26" rx="3" opacity="0.5"/></g>
  <text x="142" y="404" font-size="11" fill="#065f46" font-family="monospace">&#215;30 passes</text>
  <text x="56" y="452" font-size="12" fill="#064e3b" font-family="monospace">p&#772; = mean = prediction</text>
  <text x="56" y="472" font-size="12" fill="#064e3b" font-family="monospace">&#963; = per-class std</text>
  <text x="56" y="490" font-size="11.5" fill="#059669">= uncertainty</text>

  <!-- Panel C: temperature scaling -->
  <rect x="320" y="350" width="250" height="150" rx="6" fill="#ffffff" stroke="#059669"/>
  <text x="336" y="374" font-size="13" font-weight="700" fill="#064e3b">Temperature scaling</text>
  <text x="336" y="392" font-size="11.5" fill="#065f46" font-family="monospace">p = &#963;( logit(p&#772;) / T )</text>
  <rect x="336" y="400" width="92" height="90" fill="#f8fafc" stroke="#94a3b8"/>
  <line x1="336" y1="490" x2="428" y2="400" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <path d="M336,490 C376,485 406,455 428,400" fill="none" stroke="#9ca3af" stroke-width="1.7"/>
  <path d="M336,490 C364,474 398,438 428,400" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="382" y="504" font-size="9" text-anchor="middle" fill="#64748b">confidence</text>
  <line x1="444" y1="432" x2="462" y2="432" stroke="#9ca3af" stroke-width="2.5"/><text x="466" y="436" font-size="10" fill="#64748b">uncalibrated</text>
  <line x1="444" y1="452" x2="462" y2="452" stroke="#059669" stroke-width="2.5"/><text x="466" y="456" font-size="10" fill="#059669">calibrated</text>

  <!-- Panel B: prototype-margin -->
  <rect x="600" y="350" width="230" height="150" rx="6" fill="#ffffff" stroke="#059669"/>
  <text x="616" y="374" font-size="13" font-weight="700" fill="#064e3b">Prototype-margin</text>
  <text x="616" y="392" font-size="11" fill="#065f46">single pass, interpretable</text>
  <line x1="632" y1="482" x2="812" y2="482" stroke="#94a3b8"/>
  <rect x="656" y="412" width="34" height="70" fill="#10b981"/><text x="673" y="497" font-size="10" text-anchor="middle" fill="#334155" font-family="monospace">s_own</text>
  <rect x="726" y="446" width="34" height="36" fill="#94a3b8"/><text x="743" y="497" font-size="10" text-anchor="middle" fill="#334155" font-family="monospace">s_comp</text>
  <text x="715" y="408" font-size="11.5" text-anchor="middle" fill="#064e3b" font-family="monospace">u = &#8722;|s_own&#8722;s_comp|</text>

  <!-- Panel D: abstention -->
  <rect x="860" y="350" width="280" height="150" rx="6" fill="#ffffff" stroke="#059669"/>
  <text x="876" y="374" font-size="13" font-weight="700" fill="#064e3b">Abstention</text>
  <text x="876" y="391" font-size="10.5" fill="#065f46">rank ECG&#8211;class predictions;</text>
  <text x="876" y="405" font-size="10.5" fill="#065f46">retain low-uncertainty predictions</text>
  <rect x="880" y="418" width="150" height="46" fill="#ecfdf5" stroke="#10b981"/>
  <rect x="1030" y="418" width="86" height="46" fill="#fef2f2" stroke="#ef4444"/>
  <g fill="#334155"><circle cx="895" cy="441" r="2.2"/><circle cx="915" cy="441" r="2.2"/><circle cx="940" cy="441" r="2.2"/><circle cx="965" cy="441" r="2.2"/><circle cx="995" cy="441" r="2.2"/><circle cx="1045" cy="441" r="2.2"/><circle cx="1075" cy="441" r="2.2"/><circle cx="1100" cy="441" r="2.2"/></g>
  <line x1="880" y1="470" x2="1116" y2="470" stroke="#94a3b8" marker-end="url(#a)"/>
  <text x="998" y="486" font-size="9.5" text-anchor="middle" fill="#64748b">predictions ordered by increasing uncertainty</text>
  <text x="955" y="414" font-size="10" text-anchor="middle" fill="#059669">retain</text>
  <text x="1073" y="414" font-size="10" text-anchor="middle" fill="#ef4444">defer</text>

  <!-- internal arrows -->
  <line x1="290" y1="425" x2="318" y2="425" stroke="#059669" stroke-width="1.8" marker-end="url(#ag)"/><text x="304" y="418" font-size="10" text-anchor="middle" fill="#059669">p&#772;</text>
  <line x1="830" y1="425" x2="858" y2="425" stroke="#059669" stroke-width="1.8" marker-end="url(#ag)"/><text x="844" y="418" font-size="10" text-anchor="middle" fill="#059669">margin</text>
  <path d="M165,500 L165,560 L1000,560 L1000,502" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="560" y="576" font-size="10.5" text-anchor="middle" fill="#059669">abstention ranks by MC &#963; or by prototype-margin, evaluated separately</text>

  <!-- footer -->
  <text x="30" y="646" font-size="12" fill="#475569">Training study (not shown here): standard vs confidence-weighted (BCE) and prototype-loss ablations.</text>
  <text x="30" y="672" font-size="12" fill="#475569">Evaluated on PTB-XL, Chapman-Shaoxing and Georgia &#183; three training seeds on a fixed partition.</text>
</svg>
